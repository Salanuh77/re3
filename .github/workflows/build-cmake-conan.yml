name: re3 conan+cmake
on:
  pull_request:
  push:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: GL3
          - os: windows-2022
            platform: D3D9
          - os: ubuntu-22.04
            platform: GL3
          - os: macos-14
            platform: GL3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported build tools
        run: python -m pip install "conan>=2.2,<3" "cmake>=3.30,<4"
      - name: Detect the host compiler
        run: conan profile detect --force
      - name: Install dependencies using Conan 2
        run: >-
          conan install .github/conanfile.py --output-folder build/deps
          --build=missing -s build_type=RelWithDebInfo
          -o "&:platform=${{ matrix.platform }}"
          -c tools.system.package_manager:mode=install
          -c tools.system.package_manager:sudo=True
      - name: Configure the game using the Conan toolchain
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run([
              "cmake", "-S", ".", "-B", "build/game",
              f"-DCMAKE_TOOLCHAIN_FILE={Path('build/deps/conan_toolchain.cmake').resolve()}",
              "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
          ], check=True)
      - name: Build the game
        run: cmake --build build/game --config RelWithDebInfo --parallel 2
      - name: Create binary package
        working-directory: build/game
        run: cpack -C RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.platform }}-openal
          path: build/game/*.zip
          if-no-files-found: error

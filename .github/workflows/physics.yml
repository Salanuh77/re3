name: Physics regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Configure tests with the Python that installed Behave
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([
              "cmake", "-S", ".", "-B", "build/tests",
              "-DRE3_BUILD_GAME=OFF", "-DRE3_BDD_TESTS=ON",
              f"-DPython3_EXECUTABLE={sys.executable}",
          ], check=True)
      - run: cmake --build build/tests --config Release
      - run: ctest --test-dir build/tests -C Release --output-on-failure

  windows-game:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure D3D9 and bundled audio dependencies
        shell: pwsh
        run: >-
          cmake -S . -B build/game -A x64 -DLIBRW_PLATFORM=D3D9
          "-DOPENAL_INCLUDE_DIR=$env:GITHUB_WORKSPACE/vendor/openal-soft/include"
          "-DOPENAL_LIBRARY=$env:GITHUB_WORKSPACE/vendor/openal-soft/libs/Win64/OpenAL32.lib"
          "-Dmpg123_INCLUDE_DIR=$env:GITHUB_WORKSPACE/vendor/mpg123/include"
          "-Dmpg123_LIBRARIES=$env:GITHUB_WORKSPACE/vendor/mpg123/lib/Win64/libmpg123-0.lib"
      - run: cmake --build build/game --config ${{ matrix.configuration }} --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: re3-windows-${{ matrix.configuration }}
          path: build/game/src/${{ matrix.configuration }}/re3.exe

name: re3 premake amd64
on:
  pull_request:
  push:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [win-amd64-librw_d3d9-oal, win-amd64-librw_gl3_glfw-oal]
        buildtype: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Download GLFW from its official release
        if: contains(matrix.platform, 'gl3_glfw')
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/glfw/glfw/releases/download/3.3.2/glfw-3.3.2.bin.WIN64.zip -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath vendor
      - name: Configure build
        run: ./premake5 vs2019 --with-librw --no-full-paths --glfwdir64=vendor/glfw-3.3.2.bin.WIN64
      - name: Build using the installed VS 2022 toolset
        run: msbuild -m build/re3.sln /p:Configuration=${{ matrix.buildtype }} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143
      - name: Package binaries
        shell: pwsh
        run: |
          Copy-Item bin/${{ matrix.platform }}/${{ matrix.buildtype }}/re3.exe gamefiles/
          Copy-Item bin/${{ matrix.platform }}/${{ matrix.buildtype }}/re3.pdb gamefiles/
      - name: Package OpenAL runtime dependencies
        if: contains(matrix.platform, 'oal')
        shell: pwsh
        run: |
          Copy-Item vendor/mpg123/dist/Win64/libmpg123-0.dll gamefiles/
          Copy-Item vendor/openal-soft/dist/Win64/OpenAL32.dll gamefiles/
      - uses: actions/upload-artifact@v4
        with:
          name: re3_${{ matrix.buildtype }}_${{ matrix.platform }}
          path: gamefiles/*
          if-no-files-found: error
